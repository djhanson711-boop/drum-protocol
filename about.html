<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>The Story Behind the Song | Drum Protocol</title><style>
*{box-sizing:border-box}body{margin:0;background:#07172a;color:#f7e9c9;font-family:Georgia,serif}nav{display:flex;gap:18px;flex-wrap:wrap;justify-content:center;padding:16px;background:#07101e}nav a{color:#f6d796}h1{text-align:center;color:#f4d38a;font-weight:normal}.art{display:block;width:100%;height:auto}.intro{text-align:center;padding:12px 20px}.content{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr);gap:22px;padding:20px;align-items:start;max-width:1600px;margin:auto}.letter{color:#382313;padding:34px 38px;background:#e8cf9c;border:10px ridge #ac7a3e;box-shadow:0 8px 30px #0008;font-size:clamp(15px,1.3vw,20px);line-height:1.6}.letter p{margin:0 0 1em}.prayer{padding:30px;color:#ffe4aa;background:#061a34;border:8px double #d8ac55;box-shadow:0 8px 30px #0008;text-align:center;font-size:clamp(18px,1.5vw,24px);line-height:1.7}.prayer h2{color:#f4cb73;font-weight:normal}.prayer p{margin:0 0 1.1em}@media(max-width:700px){.content{grid-template-columns:1fr;padding:10px}.letter,.prayer{padding:18px}}</style><style>.artwrap{position:relative;width:100%;margin:0 auto}.hotspot{position:absolute;border:2px solid transparent;background:transparent;cursor:zoom-in;border-radius:12px;display:flex;align-items:flex-end;justify-content:center;padding:0 0 3%;color:#fff;font:600 clamp(11px,1.3vw,18px) Georgia,serif}.hotspot span{background:#07172add;border:1px solid #eac26e;border-radius:30px;padding:9px 15px;box-shadow:0 2px 14px #0009}.hotspot:hover,.hotspot:focus-visible{outline:none;border-color:#ffe09b;background:#ffe09b18}.hotspot:hover span,.hotspot:focus-visible span{background:#a06d22}.letterspot{left:2%;top:17%;width:55%;height:73%}.prayerspot{left:59%;top:24%;width:36%;height:67%}.lightbox[hidden]{display:none}.lightbox{position:fixed;inset:0;z-index:1000;background:#020915ed;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:55px 14px 15px}.largewrap{max-height:calc(100vh - 120px);max-width:98vw;overflow:auto;box-shadow:0 12px 45px #000;border:2px solid #dfb76c}.largewrap img{display:block;width:auto;height:auto;max-width:none;min-width:min(1050px,94vw)}.lightbox .close{position:absolute;top:12px;right:18px;background:#d6ad5c;color:#07172a;border:0;border-radius:8px;padding:10px 16px;font:bold 16px Georgia;cursor:pointer}.lightbox p{margin:10px 0;color:#f8db98;text-align:center;font-size:13px}@media(max-width:700px){.hotspot span{font-size:10px;padding:5px}.largewrap img{min-width:850px}}</style></head><body><nav><a href="index.html">Home</a><a href="about.html">About the Song</a><a href="drummers.html">Drummers</a><a href="gallery.html">Gallery</a><a href="bible-verses.html">Bible Verses</a><a href="contact.html">Contact</a></nav><main class="artwrap"><img alt="Patriotic September 11 memorial design with a vintage letter on the left and a framed prayer on the right" class="art" src="Drum-Protocol-Approved-911-Design.png"/><button class="hotspot letterspot" aria-label="Enlarge the letter from Mary M. Hanson" onclick="showLarge('Story-Letter-Enlarged.png','Letter from Mary M. Hanson')"><span>Click to enlarge letter <b>⤢</b></span></button><button class="hotspot prayerspot" aria-label="Enlarge A Prayer for America" onclick="showLarge('Story-Prayer-Enlarged.png','A Prayer for America')"><span>Click to enlarge prayer <b>⤢</b></span></button></main><div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Enlarged letter or prayer" hidden onclick="if(event.target===this)closeLarge()"><button class="close" onclick="closeLarge()" aria-label="Close enlarged view">✕ Close</button><div class="largewrap"><img id="largeimage" alt=""/></div><p>Click outside the picture or press Escape to close</p></div><script>function showLarge(src,alt){let d=document.getElementById('lightbox'),i=document.getElementById('largeimage');i.src=src;i.alt=alt;d.hidden=false;document.body.style.overflow='hidden';d.querySelector('.close').focus()}function closeLarge(){document.getElementById('lightbox').hidden=true;document.body.style.overflow=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLarge()});</script></body></html>
