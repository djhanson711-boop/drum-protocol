<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gallery — Drum Protocol</title><style>
*{box-sizing:border-box} body{margin:0;background:#d8bd82;font-family:Georgia,'Times New Roman',serif;color:#33220f}
.nav{background:#f0d7a2;border-top:5px double #9a6a24;border-bottom:5px double #9a6a24;text-align:center;padding:13px 8px}
.nav a{color:#3d2910;text-decoration:none;font-weight:bold;margin:0 12px}
.page{max-width:1180px;margin:26px auto;padding:0 18px}
.document{background:radial-gradient(circle at 50% 10%,rgba(255,248,214,.9),rgba(238,207,145,.86) 55%,rgba(194,146,76,.5)),linear-gradient(#f1d8a5,#dfbd7a);border:9px double #8b5c1b;box-shadow:0 8px 22px rgba(55,35,10,.35);padding:42px 54px}
h1{text-align:center;font-style:italic;color:#533411;font-size:42px;margin:0 0 24px}
.letter{font-size:18px;line-height:1.55;max-width:900px;margin:auto}.signature{text-align:right;font-style:italic;font-size:24px}
.heroimg{display:block;width:100%;max-width:920px;margin:0 auto;border:8px double #8b5c1b}
.gallerygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:24px}.gallerygrid img{width:100%;height:260px;object-fit:cover;border:6px double #8b5c1b;background:#ead09b;padding:4px;cursor:zoom-in;transition:transform .15s ease}.gallerygrid img:hover{transform:scale(1.02)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.trio figure{margin:0;border:7px double #8b5c1b;background:#ead09b;padding:8px}.trio img{width:100%;display:block}.trio figcaption{text-align:center;font-weight:bold;padding:8px}

.lightbox{display:none;position:fixed;z-index:9999;inset:0;background:rgba(0,0,0,.92);align-items:center;justify-content:center;padding:28px}
.lightbox.open{display:flex}
.lightbox img{max-width:96vw;max-height:92vh;width:auto;height:auto;object-fit:contain;border:5px solid #d7b15b;box-shadow:0 0 30px rgba(0,0,0,.7)}
.lightbox .close{position:fixed;top:14px;right:24px;color:white;font:46px/1 Arial,sans-serif;cursor:pointer;background:none;border:0}

@media(max-width:800px){.gallerygrid,.trio{grid-template-columns:1fr}.nav a{display:inline-block;margin:6px}.document{padding:24px 18px}}
</style></head><body><div class="nav">

</div><main class="page"><div class="document"><h1>Gallery</h1>

<div class="gallerygrid" id="galleryGrid"><img src="Patriotic-Eagle.png" alt="Gallery image"><img src="Drum-Protocol-About.png" alt="Gallery image"><img src="Drum-Protocol-Three-Drummers.png" alt="Gallery image"><img src="Revolutionary-Prayer.png" alt="Gallery image"><img src="Marys-Letter-to-President-Trump.png" alt="Gallery image"><img src="Trump-Response-Letter.jpg" alt="Gallery image"><img src="Trump_Portrait_Drum_Protocol.png" alt="Gallery image"></div></div></main>
<div class="lightbox" id="lightbox" aria-hidden="true">
<button class="close" id="closeLightbox" aria-label="Close enlarged image">&times;</button>
<img id="lightboxImage" alt="Enlarged gallery image">
</div>
<script>
(function(){
  const box=document.getElementById('lightbox');
  const big=document.getElementById('lightboxImage');
  const close=document.getElementById('closeLightbox');
  document.querySelectorAll('#galleryGrid img').forEach(function(img){
    img.setAttribute('tabindex','0');
    img.setAttribute('title','Click to enlarge');
    function openImage(){
      big.src=img.src;
      big.alt=img.alt || 'Enlarged gallery image';
      box.classList.add('open');
      box.setAttribute('aria-hidden','false');
    }
    img.addEventListener('click',openImage);
    img.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();openImage();}});
  });
  function shut(){box.classList.remove('open');box.setAttribute('aria-hidden','true');big.src='';}
  close.addEventListener('click',shut);
  box.addEventListener('click',function(e){if(e.target===box)shut();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')shut();});
})();
</script>
</body></html>
