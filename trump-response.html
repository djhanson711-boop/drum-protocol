    <h1>Trump &amp; Response</h1>
    <p class="enlarge-note">Click any image to enlarge it. Click outside the enlarged image or press Esc to close.</p>

    <div class="trio">
      <figure>
        <button class="zoom" type="button" data-full="Marys-Letter-to-President-Trump.png" aria-label="Enlarge Mary’s letter">
          <img src="Marys-Letter-to-President-Trump.png" alt="Mary’s letter">
        </button>
        <figcaption>Mary’s Letter — Click to Enlarge</figcaption>
      </figure>

      <figure>
        <button class="zoom" type="button" data-full="Trump_Portrait_Drum_Protocol.png" aria-label="Enlarge portrait">
          <img src="Trump_Portrait_Drum_Protocol.png" alt="Portrait">
        </button>
        <figcaption>Portrait — Click to Enlarge</figcaption>
      </figure>

      <figure>
        <button class="zoom" type="button" data-full="Trump-Response-Letter.jpg" aria-label="Enlarge response letter">
          <img src="Trump-Response-Letter.jpg" alt="Response letter">
        </button>
        <figcaption>Response Letter — Click to Enlarge</figcaption>
      </figure>
    </div>
  </div>

  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="close" type="button" aria-label="Close enlarged image">×</button>
    <img id="lightbox-img" alt="">
  </div>

<style>
.enlarge-note{text-align:center;font-weight:bold;margin:0 0 22px}
.trio{display:grid;grid-template-columns:1fr .72fr 1fr;gap:22px;align-items:start}
.trio figure{margin:0;text-align:center}
.zoom{display:block;width:100%;padding:0;border:5px double #9a6a24;background:#f4dfad;cursor:zoom-in}
.zoom img{display:block;width:100%;height:470px;object-fit:contain;background:#fff}
figcaption{font-weight:bold;padding:9px}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9999;padding:30px}
.lightbox.open{display:flex}
.lightbox img{max-width:94vw;max-height:92vh;object-fit:contain;background:white;box-shadow:0 0 24px rgba(255,255,255,.25)}
.close{position:fixed;right:24px;top:15px;border:0;background:transparent;color:white;font-size:52px;line-height:1;cursor:pointer}
@media(max-width:800px){.trio{grid-template-columns:1fr}.zoom img{height:auto;max-height:70vh}}
</style>

<script>
const box=document.getElementById('lightbox'), full=document.getElementById('lightbox-img');
document.querySelectorAll('.zoom').forEach(b=>b.addEventListener('click',()=>{
  full.src=b.dataset.full; full.alt=b.querySelector('img').alt; box.classList.add('open'); box.setAttribute('aria-hidden','false');
}));
function closeBox(){box.classList.remove('open');box.setAttribute('aria-hidden','true');full.src='';}
box.addEventListener('click',e=>{if(e.target===box)closeBox();});
document.querySelector('.close').addEventListener('click',closeBox);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeBox();});
</script>
