<!doctype html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trump &amp; Response — Drum Protocol</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071b39;font-family:Georgia,"Times New Roman",serif;color:#3c2810}
.nav{background:#efd49a;border-top:5px double #98671f;border-bottom:5px double #98671f;text-align:center;padding:13px 8px}
.nav a{color:#3c2810;text-decoration:none;font-weight:bold;margin:0 10px}
.page{max-width:1450px;margin:25px auto;padding:0 18px}
.paper{background:radial-gradient(circle at 50% 8%,#fff4d4,#e6c47e 70%,#bd8840);border:10px double #8b5c1b;padding:30px;box-shadow:0 8px 24px #0008}
h1{text-align:center;font-style:italic;font-size:44px;margin:0 0 8px}
.note{text-align:center;font-weight:bold;font-size:18px;margin:0 0 24px}
.trio{display:grid;grid-template-columns:1fr .72fr 1fr;gap:24px;align-items:start}
figure{margin:0;text-align:center}
.zoom{display:block;width:100%;padding:8px;border:7px double #8b5c1b;background:#f4dfad;cursor:zoom-in}
.zoom img{display:block;width:100%;height:610px;object-fit:contain;background:#fff}
figcaption{font-size:19px;font-weight:bold;padding:10px}
.lightbox{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.92);z-index:9999;padding:20px}
.lightbox.open{display:flex}.lightbox img{max-width:96vw;max-height:94vh;object-fit:contain;background:white}
.close{position:fixed;right:24px;top:14px;border:0;background:transparent;color:#fff;font-size:58px;cursor:pointer}
@media(max-width:850px){.trio{grid-template-columns:1fr}.zoom img{height:auto;max-height:80vh}.nav a{display:inline-block;margin:6px}}
</style>
<style>
/* Polished presentation for the existing center portrait only */
.trump-polished{
  background:linear-gradient(145deg,#e9d7a5,#b58a3c 45%,#f1dfaa);
  padding:8px;
  border:2px solid #6e4b16;
  border-radius:8px;
  box-shadow:0 10px 28px rgba(0,0,0,.38), inset 0 0 0 2px rgba(255,244,190,.55);
}
.trump-polished img{
  display:block;
  width:100%;
  height:610px;
  object-fit:contain;
  object-position:center;
  background:#111;
  border-radius:3px;
}
</style>

</head><body>
<div class="nav"><a href="index.html">Home</a><a href="story.html">Story</a><a href="bible-verses.html">Bible Verses</a><a href="gallery.html">Gallery</a></div>
<main class="page"><div class="paper">
<h1>Trump &amp; Response</h1>
<p class="note">Click any of the three images to make it full-screen size.</p>
<div class="trio">
<figure><button class="zoom" data-full="Marys-Letter-to-President-Trump.png"><img src="Marys-Letter-to-President-Trump.png" alt="Mary's letter"></button><figcaption>Mary’s Letter — Click to Enlarge</figcaption></figure>
<figure><button class="zoom" data-full="Trump_Portrait_Drum_Protocol.png"><div class="trump-polished"><img src="Trump_Portrait_Drum_Protocol.png" alt="Portrait"></div></button><figcaption>Portrait — Click to Enlarge</figcaption></figure>
<figure><button class="zoom" data-full="Trump-Response-Letter.jpg"><img src="Trump-Response-Letter.jpg" alt="Response letter"></button><figcaption>Response Letter — Click to Enlarge</figcaption></figure>
</div></div></main>
<div id="lightbox" class="lightbox"><button class="close" aria-label="Close">×</button><img id="big" alt=""></div>
<script>
const box=document.getElementById('lightbox'),big=document.getElementById('big');
document.querySelectorAll('.zoom').forEach(b=>b.onclick=()=>{big.src=b.dataset.full;box.classList.add('open')});
function closeBox(){box.classList.remove('open');big.src=''}
document.querySelector('.close').onclick=closeBox;
box.onclick=e=>{if(e.target===box)closeBox()};
document.onkeydown=e=>{if(e.key==='Escape')closeBox()};
</script></body></html>
