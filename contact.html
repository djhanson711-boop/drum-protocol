<title>Contact | Drum Protocol</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#071427}
body{font-family:Georgia,"Times New Roman",serif;color:#251807;padding:30px}
.frame{max-width:1050px;margin:auto;background:#0b1d38;border:4px double #d2aa4d;padding:14px;box-shadow:0 12px 38px #0008}

.links{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;max-width:900px;margin:0 auto}
.card{display:flex;min-height:170px;align-items:center;justify-content:center;flex-direction:column;padding:24px;border:3px double #b17c29;background:#10274a;color:#f5dc8c;text-decoration:none;box-shadow:0 7px 18px #0004;font-size:24px;font-weight:bold}
.card span{display:block;font-size:17px;font-weight:normal;margin-top:12px;color:#fff4c5;overflow-wrap:anywhere}
.card:hover,.card:focus{transform:translateY(-3px);outline:3px solid #f5dc8c}
.home{display:inline-block;margin-top:45px;padding:12px 25px;background:#10274a;color:#f5dc8c;border:2px solid #7d551a;text-decoration:none;font-weight:bold}
@media(max-width:750px){.links{grid-template-columns:1fr}.page{padding:38px 20px}}

</head>
